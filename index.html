<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6f0">
  <meta name="description" content="A quiet calendar journal. One page for every day, stored on your device.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>Daywell · Your daily pages</title>
  <style>
    :root{color-scheme:light;--paper:#f8f6f0;--paper2:#fffefa;--ink:#252b27;--muted:#85877e;--line:#e6e2d8;--accent:#58715e;--accent-soft:#e8eee5;--today:#dce8d8;--shadow:0 18px 55px rgba(44,49,40,.08)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:ui-serif,Georgia,"Times New Roman",serif}button,textarea{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .app{max-width:1180px;margin:0 auto;padding:clamp(18px,4vw,48px) clamp(14px,3vw,34px) 28px;min-height:100dvh}
    header{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:34px;height:34px;border:1px solid #d8d6ca;border-radius:50%;display:grid;place-items:center;color:var(--accent);font-size:19px}.brand-name{font-size:21px;letter-spacing:-.7px}.brand-note{font:11px/1.5 system-ui,sans-serif;color:var(--muted);letter-spacing:.04em}.header-actions{display:flex;gap:8px;align-items:center}.quiet-btn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 14px;font:12px system-ui,sans-serif}.quiet-btn:hover{background:#efede5}.icon-btn{border:1px solid var(--line);background:var(--paper2);border-radius:50%;width:36px;height:36px;font:18px system-ui,sans-serif;display:grid;place-items:center}.page-title{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:0 0 24px}.eyebrow{font:11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);margin-bottom:8px}.month-title{font-size:clamp(32px,5vw,48px);font-weight:400;letter-spacing:-1.8px;line-height:1.08;margin:0}.month-controls{display:flex;gap:7px;align-items:center}.calendar{background:var(--paper2);border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:var(--shadow)}.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{background:#f4f1e9;border-bottom:1px solid var(--line)}.weekday{text-align:center;padding:13px 4px;font:10px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.12em;color:#77796f}.day{position:relative;min-height:clamp(92px,12.5vw,145px);border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:11px 10px;display:flex;flex-direction:column;gap:10px;min-width:0;transition:background .15s}.day:nth-child(7n){border-right:0}.day:hover{background:#f7f5ef}.day.outside{background:#fbfaf6;color:#b6b5ac}.day.outside .day-number{opacity:.65}.day.today .day-number{background:var(--accent);color:white}.day-number{font:12px system-ui,sans-serif;width:26px;height:26px;display:grid;place-items:center;border-radius:50%;flex-shrink:0}.day-preview{font:12px/1.45 system-ui,sans-serif;color:#77796f;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}.entry-dot{width:5px;height:5px;background:var(--accent);border-radius:50%;position:absolute;top:17px;right:14px}.calendar-footer{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 2px;color:var(--muted);font:11px system-ui,sans-serif}.legend{display:flex;align-items:center;gap:7px}.legend-dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}.footer-note{font:11px system-ui,sans-serif;color:var(--muted);text-align:center;padding:18px 0 0}
    .editor-view{display:none}.editor-view.active{display:block}.calendar-view.hidden{display:none}.editor-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 28px}.back-btn{border:0;background:transparent;padding:8px 0;color:var(--accent);font:13px system-ui,sans-serif}.day-nav{display:flex;gap:7px}.editor-card{max-width:850px;min-height:min(68vh,720px);margin:0 auto;background:var(--paper2);border:1px solid var(--line);border-radius:8px;padding:clamp(22px,5vw,56px);box-shadow:var(--shadow);display:flex;flex-direction:column}.editor-date{font-size:clamp(25px,4vw,38px);font-weight:400;letter-spacing:-1px;margin:0 0 8px}.editor-subtitle{font:11px system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:32px}.writing-area{width:100%;flex:1;min-height:350px;resize:vertical;border:0;background:transparent;color:var(--ink);font:17px/1.9 ui-serif,Georgia,serif;outline:none!important;padding:0}.writing-area::placeholder{color:#b3b0a6}.editor-bottom{border-top:1px solid var(--line);margin-top:22px;padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;font:11px system-ui,sans-serif;color:var(--muted)}.save-status{display:flex;align-items:center;gap:7px}.status-dot{width:6px;height:6px;border-radius:50%;background:#a3a49b}.status-dot.saved{background:var(--accent)}.word-count{white-space:nowrap}.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#29332c;color:white;border-radius:999px;padding:11px 17px;font:12px system-ui,sans-serif;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.install-hint{display:none}
    @media(min-width:900px){.day{min-height:135px;padding:13px}.day-preview{font-size:12px}.app{padding-top:35px}}@media(max-width:600px){.app{padding:16px 10px calc(18px + env(safe-area-inset-bottom))}header{margin-bottom:26px}.brand-note{display:none}.brand-name{font-size:20px}.header-actions .quiet-btn{padding:8px 10px}.page-title{align-items:center;margin-bottom:18px}.month-title{font-size:35px}.weekday{font-size:9px;padding:11px 1px;letter-spacing:.06em}.day{min-height:clamp(67px,16vw,96px);padding:7px 4px;gap:5px}.day-number{width:23px;height:23px;font-size:11px}.entry-dot{top:12px;right:5px;width:4px;height:4px}.day-preview{font-size:10px;line-height:1.3;-webkit-line-clamp:2}.calendar-footer{font-size:10px}.editor-card{padding:22px 17px;min-height:72vh}.writing-area{font-size:16px;min-height:45vh}.editor-date{font-size:28px}.editor-subtitle{margin-bottom:24px}.header-actions #installBtn{display:none}.footer-note{padding-top:12px}}@media(max-width:360px){.day{min-height:62px}.day-number{width:20px;height:20px}.day-preview{font-size:9px}.month-title{font-size:30px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="brand-mark" aria-hidden="true">d</div><div><div class="brand-name">daywell</div><div class="brand-note">A little space for every day</div></div></div>
    <div class="header-actions"><button class="quiet-btn" id="backupBtn" type="button">Backup</button><button class="quiet-btn" id="restoreBtn" type="button">Restore</button><input id="restoreFile" type="file" accept="application/json,.json" hidden><button class="quiet-btn" id="todayBtn">Today</button><button class="quiet-btn" id="installBtn" hidden>Install app</button></div>
  </header>
  <main>
    <section class="calendar-view" id="calendarView" aria-label="Monthly journal calendar">
      <div class="page-title"><div><div class="eyebrow">Your journal</div><h1 class="month-title" id="monthTitle">November 2026</h1></div><div class="month-controls"><button class="icon-btn" id="prevMonth" aria-label="Previous month">‹</button><button class="icon-btn" id="nextMonth" aria-label="Next month">›</button></div></div>
      <div class="calendar"><div class="weekdays" aria-hidden="true"><div class="weekday">Mon</div><div class="weekday">Tue</div><div class="weekday">Wed</div><div class="weekday">Thu</div><div class="weekday">Fri</div><div class="weekday">Sat</div><div class="weekday">Sun</div></div><div class="days" id="daysGrid"></div></div>
      <div class="calendar-footer"><div class="legend"><span class="legend-dot"></span> A page you've written</div><div id="entrySummary">Your pages, all in one place</div></div>
      <div class="footer-note">Just you and your thoughts. Stored on this device.</div>
    </section>
    <section class="editor-view" id="editorView" aria-label="Daily journal editor">
      <div class="editor-top"><button class="back-btn" id="backBtn">← All days</button><div class="day-nav"><button class="icon-btn" id="prevDay" aria-label="Previous day">‹</button><button class="icon-btn" id="nextDay" aria-label="Next day">›</button></div></div>
      <article class="editor-card"><h1 class="editor-date" id="editorDate"></h1><div class="editor-subtitle">A page for whatever's on your mind</div><textarea class="writing-area" id="entryText" placeholder="Start anywhere..." aria-label="Journal entry" spellcheck="true"></textarea><div class="editor-bottom"><div class="save-status" aria-live="polite"><span class="status-dot saved" id="statusDot"></span><span id="saveStatus">Saved on this device</span></div><span class="word-count" id="wordCount">0 words</span></div></article>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
</div>
<script>
(function(){
  'use strict';
  const $ = id => document.getElementById(id);
  const state = { month: new Date(new Date().getFullYear(),new Date().getMonth(),1), selected: null, entries: new Map(), db: null, saveTimer: null, toastTimer: null, installPrompt: null, revision: 0 };
  const pad = n => String(n).padStart(2,'0');
  const keyFor = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const parseKey = key => { const [y,m,d]=key.split('-').map(Number); return new Date(y,m-1,d); };
  const niceDate = d => new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(d);
  const monthName = d => new Intl.DateTimeFormat(undefined,{month:'long',year:'numeric'}).format(d);
  const escapeHtml = s => s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function toast(message){ $('toast').textContent=message; $('toast').classList.add('show'); clearTimeout(state.toastTimer); state.toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2400); }
  function openDB(){
    return new Promise((resolve,reject)=>{
      if(!('indexedDB' in window)){ reject(new Error('IndexedDB unavailable')); return; }
      const request=indexedDB.open('daywell-journal',1);
      request.onupgradeneeded=()=>{ const db=request.result; if(!db.objectStoreNames.contains('entries')) db.createObjectStore('entries',{keyPath:'date'}); };
      request.onsuccess=()=>resolve(request.result); request.onerror=()=>reject(request.error);
    });
  }
  function dbAll(){
    return new Promise((resolve,reject)=>{ const tx=state.db.transaction('entries','readonly'); const req=tx.objectStore('entries').getAll(); req.onsuccess=()=>resolve(req.result||[]); req.onerror=()=>reject(req.error); });
  }
  function dbPut(entry){
    return new Promise((resolve,reject)=>{ const tx=state.db.transaction('entries','readwrite'); tx.objectStore('entries').put(entry); tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error); tx.onabort=()=>reject(tx.error||new Error('Save failed')); });
  }
  function dbDelete(date){
    return new Promise((resolve,reject)=>{ const tx=state.db.transaction('entries','readwrite'); tx.objectStore('entries').delete(date); tx.oncomplete=()=>resolve(); tx.onerror=()=>reject(tx.error); });
  }
  function dbPutMany(entries){
    return new Promise((resolve,reject)=>{
      const tx=state.db.transaction('entries','readwrite');
      const store=tx.objectStore('entries');
      entries.forEach(entry=>store.put(entry));
      tx.oncomplete=()=>resolve();
      tx.onerror=()=>reject(tx.error||new Error('Restore failed'));
      tx.onabort=()=>reject(tx.error||new Error('Restore failed'));
    });
  }
  async function loadEntries(){
    try { state.db=await openDB(); const all=await dbAll(); all.forEach(e=>state.entries.set(e.date,e.text)); }
    catch(err){
      try { const raw=localStorage.getItem('daywell-entries-v1'); if(raw){ const obj=JSON.parse(raw); Object.entries(obj).forEach(([k,v])=>state.entries.set(k,v)); } }
      catch(e){ toast('Could not read local journal storage.'); }
    }
    renderCalendar();
  }
  async function persist(date,text){
    try {
      if(state.db){ if(text.trim()) await dbPut({date,text,updatedAt:Date.now()}); else await dbDelete(date); }
      else { const obj={}; state.entries.forEach((v,k)=>{if(v.trim())obj[k]=v}); if(text.trim())obj[date]=text; else delete obj[date]; localStorage.setItem('daywell-entries-v1',JSON.stringify(obj)); }
      if(state.selected===date){ $('saveStatus').textContent='Saved on this device'; $('statusDot').classList.add('saved'); }
    } catch(err){ if(state.selected===date){ $('saveStatus').textContent='Could not save · keep this page open'; $('statusDot').classList.remove('saved'); } toast('Could not save this entry. Check device storage.'); }
  }
  function downloadBackup(){
    const entries=[...state.entries.entries()].filter(([,text])=>typeof text==='string'&&text.trim()).sort(([a],[b])=>a.localeCompare(b)).map(([date,text])=>({date,text}));
    const backup={format:'daywell-journal-backup',version:1,exportedAt:new Date().toISOString(),entries};
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob); const link=document.createElement('a');
    link.href=url; link.download='daywell-backup-'+keyFor(new Date())+'.json';
    document.body.appendChild(link); link.click(); link.remove(); URL.revokeObjectURL(url);
    toast(entries.length+' journal '+(entries.length===1?'page':'pages')+' backed up. Keep the file somewhere safe.');
  }
  function validateBackup(data){
    if(!data||typeof data!=='object'||data.format!=='daywell-journal-backup'||data.version!==1||!Array.isArray(data.entries)) throw new Error('This is not a supported Daywell backup.');
    const validated=new Map();
    for(const entry of data.entries){
      if(!entry||typeof entry!=='object'||typeof entry.date!=='string'||!/^\\d{4}-\\d{2}-\\d{2}$/.test(entry.date)||typeof entry.text!=='string') throw new Error('The backup contains an invalid journal page.');
      const date=parseKey(entry.date);
      if(!Number.isFinite(date.getTime())||keyFor(date)!==entry.date) throw new Error('The backup contains an invalid date.');
      if(entry.text.length>5000000) throw new Error('A journal page is too large to restore.');
      validated.set(entry.date,entry.text);
    }
    return [...validated.entries()].filter(([,text])=>text.trim()).map(([date,text])=>({date,text,updatedAt:Date.now()}));
  }
  async function restoreBackup(file){
    const raw=await file.text(); const incoming=validateBackup(JSON.parse(raw));
    const merged=new Map(state.entries);
    incoming.forEach(entry=>merged.set(entry.date,entry.text));
    const all=[...merged.entries()].filter(([,text])=>text.trim());
    if(state.db){ await dbPutMany(all.map(([date,text])=>({date,text,updatedAt:Date.now()}))); }
    else {
      const object={}; all.forEach(([date,text])=>object[date]=text);
      localStorage.setItem('daywell-entries-v1',JSON.stringify(object));
    }
    state.entries=merged;
    renderCalendar();
    toast('Restored '+incoming.length+' journal '+(incoming.length===1?'page':'pages')+'. Existing dates were merged.');
  }
  function renderCalendar(){
    $('monthTitle').textContent=monthName(state.month);
    const y=state.month.getFullYear(),m=state.month.getMonth();
    const first=new Date(y,m,1), startOffset=(first.getDay()+6)%7, count=new Date(y,m+1,0).getDate();
    const prevCount=new Date(y,m,0).getDate(), total=Math.ceil((startOffset+count)/7)*7;
    const today=keyFor(new Date()); let html='';
    for(let i=0;i<total;i++){
      let date, outside=false;
      if(i<startOffset){date=new Date(y,m-1,prevCount-startOffset+i+1);outside=true}
      else if(i>=startOffset+count){date=new Date(y,m+1,i-startOffset-count+1);outside=true}
      else date=new Date(y,m,i-startOffset+1);
      const key=keyFor(date), text=state.entries.get(key)||'', has=!!text.trim();
      html+='<button class="day'+(outside?' outside':'')+(key===today?' today':'')+'" data-date="'+key+'" aria-label="'+escapeHtml(niceDate(date))+(has?', has a journal entry':'')+'"><span class="day-number">'+date.getDate()+'</span>'+(has?'<span class="entry-dot" aria-hidden="true"></span><span class="day-preview">'+escapeHtml(text.replace(/\s+/g,' ').trim())+'</span>':'')+'</button>';
    }
    $('daysGrid').innerHTML=html;
    $('daysGrid').querySelectorAll('.day').forEach(btn=>btn.addEventListener('click',()=>openEditor(btn.dataset.date)));
    const written=[...state.entries.values()].filter(v=>v.trim()).length;
    $('entrySummary').textContent=written===1?'1 page written':written+' pages written';
  }
  function showCalendar(){ $('editorView').classList.remove('active'); $('calendarView').classList.remove('hidden'); renderCalendar(); }
  function openEditor(date){
    if(state.selected && state.selected!==date) flushSave();
    state.selected=date;
    const d=parseKey(date); $('editorDate').textContent=niceDate(d);
    $('entryText').value=state.entries.get(date)||'';
    $('wordCount').textContent=countWords($('entryText').value)+' words';
    $('saveStatus').textContent='Saved on this device'; $('statusDot').classList.add('saved');
    $('calendarView').classList.add('hidden'); $('editorView').classList.add('active');
    history.replaceState({date},'',location.pathname+'#'+date);
    window.scrollTo(0,0); $('entryText').focus({preventScroll:true});
  }
  function countWords(s){const t=s.trim();return t?t.split(/\s+/).length:0}
  function queueSave(){
    const date=state.selected;if(!date)return;
    const text=$('entryText').value;state.entries.set(date,text);
    $('wordCount').textContent=countWords(text)+' words';$('saveStatus').textContent='Saving…';$('statusDot').classList.remove('saved');
    clearTimeout(state.saveTimer);state.saveTimer=setTimeout(async()=>{await persist(date,text);renderCalendar()},450);
  }
  function flushSave(){
    clearTimeout(state.saveTimer);
    const date=state.selected;if(!date)return Promise.resolve();
    const text=$('entryText').value;state.entries.set(date,text);
    return persist(date,text).then(()=>renderCalendar());
  }
  $('backupBtn').addEventListener('click',()=>{ if(state.selected) flushSave().then(downloadBackup); else downloadBackup(); });
  $('restoreBtn').addEventListener('click',()=>$('restoreFile').click());
  $('restoreFile').addEventListener('change',async event=>{
    const file=event.target.files&&event.target.files[0]; if(!file)return;
    try { if(state.selected) await flushSave(); await restoreBackup(file); }
    catch(err){ toast(err instanceof SyntaxError?'The backup file is not valid JSON.':(err.message||'Could not restore this backup.')); }
    finally { event.target.value=''; }
  });
  $('prevMonth').addEventListener('click',()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);renderCalendar()});
  $('nextMonth').addEventListener('click',()=>{state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);renderCalendar()});
  $('todayBtn').addEventListener('click',()=>{if(state.selected){flushSave().then(()=>{const d=new Date();state.month=new Date(d.getFullYear(),d.getMonth(),1);openEditor(keyFor(d))})}else{const d=new Date();state.month=new Date(d.getFullYear(),d.getMonth(),1);renderCalendar()}});
  $('backBtn').addEventListener('click',()=>{flushSave().then(()=>{history.replaceState({},'',location.pathname);showCalendar()})});
  $('entryText').addEventListener('input',queueSave);
  $('prevDay').addEventListener('click',async()=>{await flushSave();openEditor(keyFor(new Date(parseKey(state.selected).getTime()-86400000)))});
  $('nextDay').addEventListener('click',async()=>{await flushSave();openEditor(keyFor(new Date(parseKey(state.selected).getTime()+86400000)))});
  window.addEventListener('beforeunload',e=>{if(state.saveTimer){clearTimeout(state.saveTimer); const date=state.selected;if(date){try{const text=$('entryText').value;if(state.db){const tx=state.db.transaction('entries','readwrite');if(text.trim())tx.objectStore('entries').put({date,text,updatedAt:Date.now()});else tx.objectStore('entries').delete(date)}else{const obj={};state.entries.forEach((v,k)=>{if(v.trim())obj[k]=v});if(text.trim())obj[date]=text;else delete obj[date];localStorage.setItem('daywell-entries-v1',JSON.stringify(obj))}}catch(err){}}}});
  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.selected){flushSave().then(()=>{history.replaceState({},'',location.pathname);showCalendar()})}});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();state.installPrompt=e;$('installBtn').hidden=false});
  $('installBtn').addEventListener('click',async()=>{if(!state.installPrompt){toast('Use your browser menu and choose Install app or Add to Home Screen.');return}state.installPrompt.prompt();await state.installPrompt.userChoice;state.installPrompt=null;$('installBtn').hidden=true});
  if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  loadEntries().then(()=>{const hash=location.hash.slice(1);if(/^\d{4}-\d{2}-\d{2}$/.test(hash)){const d=parseKey(hash);state.month=new Date(d.getFullYear(),d.getMonth(),1);openEditor(hash)}});
})();
</script>
</body>
</html>
